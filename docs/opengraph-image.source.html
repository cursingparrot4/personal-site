<!doctype html>
<!--
  Source for app/opengraph-image.png (spec §14).

  Rendered rather than generated: next/og's build step fails on Windows, and
  screenshotting this gets us the actual Space Grotesk / JetBrains Mono instead
  of a fallback font. To regenerate after editing, shoot it at exactly 1200x630
  with whichever Chromium is already on the machine — no dev server, no
  Playwright, no repo dependency, since the file opens fine over file://:

    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" \
      --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=8000 \
      --screenshot="<absolute path>\app\opengraph-image.png" \
      "file:///<absolute path>/docs/opengraph-image.source.html"

  Both paths must be absolute — headless Chromium resolves --screenshot against
  its own working directory, not the shell's. --virtual-time-budget is what
  waits for the webfonts: without it the shot fires on the fallback face, which
  is the one thing this file exists to avoid. On macOS/Linux substitute the
  Chrome or Chromium binary; the flags are the same.

  Two strings here are hand-copied from content/profile.ts and drift silently:
  the prompt meta (`promptMeta`) and the headline under the name. Check both
  before you shoot.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0d1114;
        color: #e2e8ec;
        font-family: "Space Grotesk", sans-serif;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        isolation: isolate;
      }
      /* Same atmosphere vocabulary as the site: a cyan beam and a vignette. */
      .beam {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(
          120% 80% at 78% -10%,
          rgba(52, 197, 221, 0.16),
          rgba(52, 197, 221, 0) 60%
        );
      }
      .vignette {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(90% 70% at 50% 45%, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.55));
      }
      .scan {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.014) 0px,
          rgba(255, 255, 255, 0.014) 1px,
          transparent 1px,
          transparent 3px
        );
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .prompt {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 25px;
        letter-spacing: 0.06em;
        padding-bottom: 22px;
        border-bottom: 1px solid #232b31;
      }
      .path {
        color: #34c5dd;
      }
      .meta {
        color: #8b979e;
        margin-left: auto;
      }
      .name {
        font-size: 96px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .headline {
        margin-top: 26px;
        font-size: 34px;
        color: #8b979e;
        max-width: 860px;
        line-height: 1.4;
      }
      .focus {
        display: flex;
        gap: 12px;
        margin-top: 40px;
      }
      .tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #8b979e;
        border: 1px solid rgba(52, 197, 221, 0.32);
        border-radius: 4px;
        padding: 7px 14px;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 23px;
        color: #8b979e;
      }
      .rule {
        width: 56px;
        height: 2px;
        background: #34c5dd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="beam"></div>
      <div class="vignette"></div>
      <div class="scan"></div>

      <div class="prompt mono">
        <span class="path">~/</span><span>aryan-ahlawat</span>
        <span class="meta">CS · Economics</span>
      </div>

      <div>
        <div class="name">Aryan Ahlawat</div>
        <div class="headline" id="headline">
          CS at Queen's, AI stream — SWE @ Co-operators, RAG pipelines, and applied ML.
        </div>
        <div class="focus">
          <span class="tag">Machine learning</span>
          <span class="tag">Retrieval / RAG</span>
          <span class="tag">Full-stack</span>
          <span class="tag">Developer tooling</span>
        </div>
      </div>

      <div class="foot mono">
        <span class="rule"></span>
        <span>aryanahlawat.dev</span>
      </div>
    </div>
  </body>
</html>
